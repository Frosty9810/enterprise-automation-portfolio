name: Validate portfolio

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate executable artifacts
        run: python scripts/validate_portfolio.py

      - name: Run ecommerce policy tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
