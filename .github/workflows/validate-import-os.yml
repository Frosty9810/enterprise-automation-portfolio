name: Validate import company agent OS

on:
  pull_request:
    paths:
      - "48 Enterprise Workflows/IMP-01 Import Company Agent Operating System/**"
      - ".github/workflows/validate-import-os.yml"
  push:
    branches:
      - main
    paths:
      - "48 Enterprise Workflows/IMP-01 Import Company Agent Operating System/**"
      - ".github/workflows/validate-import-os.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: "48 Enterprise Workflows/IMP-01 Import Company Agent Operating System/site"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: "48 Enterprise Workflows/IMP-01 Import Company Agent Operating System/site/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Test agent request boundaries
        run: npm test

      - name: Lint and check types
        run: |
          npm run lint
          npx tsc --noEmit --incremental false

      - name: Build site and API
        run: npm run build

