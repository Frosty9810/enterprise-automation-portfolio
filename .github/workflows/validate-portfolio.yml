name: Validate portfolio

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install quality dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Verify generated showcase packages
        run: python scripts/build_showcase.py --check

      - name: Validate executable artifacts
        run: python scripts/validate_portfolio.py

      - name: Run Python regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Execute n8n handoff contracts
        run: node --test tests/ghl-n8n.test.mjs

      - name: Local demo contract and generation checks
        run: |
          node --test demo-lab/test.mjs
          node demo-lab/generate.mjs --check

      - name: Run local planner benchmark
        run: node scripts/benchmark_handoff.mjs

      - name: Preserve benchmark evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handoff-benchmark
          path: reports/handoff-benchmark.json

  n8n-local-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          npm ci --prefix demo-lab --no-audit --no-fund
      - name: Check dashboard interactions against local fixtures
        run: node --test demo-lab/*.test.mjs demo-lab/test.mjs
      - name: Execute complete local Salesforce RevenueOps acceptance
        run: node demo-lab/run-salesforce.mjs
      - name: Cross-check all twelve business systems
        run: node demo-lab/run-flagships.mjs
      - name: Execute all local n8n demos
        run: |
          node demo-lab/server.mjs > /tmp/portfolio-demo.log 2>&1 &
          DEMO_SERVER_PID=$!
          trap 'kill "$DEMO_SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5680/health; then break; fi
            sleep 1
          done
          node demo-lab/verify.mjs
          node demo-lab/audit-originals.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: n8n-local-evidence
          path: |
            reports/n8n-local-executions.json
            reports/original-node-compatibility.json
            reports/salesforce-local-acceptance.json
            reports/twelve-project-acceptance.json

  public-flagship:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 48 Enterprise Workflows/IMP-01 Import Company Agent Operating System/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit --incremental false
      - run: npm run build
