name: Validate agent evidence claims

on:
  pull_request:
    paths:
      - "48 Enterprise Workflows/IMP-01 Import Company Agent Operating System/site/**"
      - ".github/workflows/validate-agent-evidence.yml"
  push:
    branches: [main]
    paths:
      - "48 Enterprise Workflows/IMP-01 Import Company Agent Operating System/site/**"
      - ".github/workflows/validate-agent-evidence.yml"

permissions:
  contents: read

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.13.0"
      - name: Check evidence authority across the registry
        working-directory: "48 Enterprise Workflows/IMP-01 Import Company Agent Operating System/site"
        run: node --experimental-strip-types --test tests/*.test.mjs
